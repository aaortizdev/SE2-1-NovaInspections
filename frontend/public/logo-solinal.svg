<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradientes metalizados del cubo exterior -->
    <linearGradient id="topFace" x1="120" y1="20" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B9EB7" />
      <stop offset="100%" stop-color="#6C7F99" />
    </linearGradient>

    <linearGradient id="leftFace" x1="33.4" y1="70" x2="120" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#687B96" />
      <stop offset="100%" stop-color="#3E4E68" />
    </linearGradient>

    <linearGradient id="rightFace" x1="120" y1="120" x2="206.6" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#99ABC4" />
      <stop offset="50%" stop-color="#7B8EA8" />
      <stop offset="100%" stop-color="#60738E" />
    </linearGradient>

    <!-- Gradientes de la cavidad interior (hueco en cara derecha) -->
    <linearGradient id="cavityBack" x1="142" y1="95" x2="185" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E5258" />
      <stop offset="100%" stop-color="#1B3242" />
    </linearGradient>

    <linearGradient id="cavityBottom" x1="142" y1="165" x2="185" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52647C" />
      <stop offset="100%" stop-color="#7386A0" />
    </linearGradient>

    <linearGradient id="cavityRightWall" x1="172" y1="90" x2="185" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D6F66" />
      <stop offset="100%" stop-color="#284355" />
    </linearGradient>

    <!-- Gradientes del nucleo verde menta brillante -->
    <linearGradient id="coreFront" x1="149" y1="110" x2="175" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64FCD9" />
      <stop offset="100%" stop-color="#4AD6B8" />
    </linearGradient>

    <linearGradient id="coreTop" x1="142" y1="100" x2="175" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#48E5C2" />
      <stop offset="100%" stop-color="#73FFE0" />
    </linearGradient>

    <linearGradient id="coreLeft" x1="142" y1="112" x2="149" y2="162" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DC9A7" />
      <stop offset="100%" stop-color="#1D9F83" />
    </linearGradient>

    <!-- Resplandor turquesa suave para el nucleo -->
    <filter id="mintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. CARA SUPERIOR DEL CUBO EXTERIOR -->
  <polygon points="120,20 206.6,70 120,120 33.4,70" fill="url(#topFace)" stroke="#9FB2CC" stroke-width="0.8" stroke-linejoin="round" />

  <!-- 2. CARA IZQUIERDA DEL CUBO EXTERIOR -->
  <polygon points="33.4,70 120,120 120,220 33.4,170" fill="url(#leftFace)" stroke="#5A6D87" stroke-width="0.8" stroke-linejoin="round" />

  <!-- 3. FONDO DE LA CAVIDAD DERECHA (HUECO) -->
  <polygon points="141.6,132.5 185,107.5 185,157.5 141.6,182.5" fill="url(#cavityBack)" />

  <!-- Pared interior derecha de la cavidad (profundidad isometrica) -->
  <polygon points="171,115.5 185,107.5 185,157.5 171,149.5" fill="url(#cavityRightWall)" />

  <!-- Piso interior de la cavidad (profundidad isometrica) -->
  <polygon points="141.6,182.5 171,149.5 185,157.5 141.6,182.5" fill="url(#cavityBottom)" />
  <polygon points="141.6,182.5 155.6,166.5 185,157.5 141.6,182.5" fill="url(#cavityBottom)" opacity="0.85" />

  <!-- 4. CUBO INTERIOR VERDE MENTA (NUCLEO) -->
  <g filter="url(#mintGlow)">
    <!-- Cara superior del nucleo menta -->
    <polygon points="141.6,125.5 167.6,110.5 175.6,115.1 149.6,130.1" fill="url(#coreTop)" />
    <!-- Cara lateral izquierda del nucleo menta -->
    <polygon points="141.6,125.5 149.6,130.1 149.6,165.1 141.6,160.5" fill="url(#coreLeft)" />
    <!-- Cara frontal derecha del nucleo menta -->
    <polygon points="149.6,130.1 175.6,115.1 175.6,150.1 149.6,165.1" fill="url(#coreFront)" />
    <!-- Brillo de arista en el nucleo -->
    <polyline points="141.6,125.5 149.6,130.1 175.6,115.1" stroke="#A6FFEC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="149.6" y1="130.1" x2="149.6" y2="165.1" stroke="#A6FFEC" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- 5. CARA DERECHA DEL CUBO EXTERIOR (MARCO CON RECORTES / COMPOUND PATH) -->
  <path d="M 120,120 L 206.6,70 L 206.6,170 L 120,220 Z M 141.6,132.5 L 141.6,182.5 L 185,157.5 L 185,107.5 Z" fill="url(#rightFace)" fill-rule="evenodd" stroke="#8598B2" stroke-width="0.6" stroke-linejoin="round" />

  <!-- 6. BISELES Y LUCES DE ARISTAS PARA ACABADO 3D METALIZADO -->
  <polyline points="33.4,70 120,120 206.6,70" stroke="#BCCCE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <line x1="120" y1="120" x2="120" y2="220" stroke="#9FB2CC" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
  <polyline points="141.6,182.5 185,157.5 185,107.5" stroke="#B4C5DC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <polyline points="185,107.5 141.6,132.5 141.6,182.5" stroke="#314057" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
</svg>